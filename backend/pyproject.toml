[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-atlas-backend"
version = "0.1.0"
description = "Python agentic workflow backbone for Paper Atlas"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "langgraph>=1.0,<2.0",
  "pydantic>=2.7,<3.0",
  "pypdf>=6.0,<7.0",
  "python-dotenv>=1.0,<2.0",
  "python-multipart>=0.0.20,<1.0",
  "boto3>=1.35,<2.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
]

[project.scripts]
paper-atlas-api = "paper_atlas.api:run"
paper-atlas-aws-check = "paper_atlas.aws:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
